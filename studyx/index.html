<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STUDYX — Student Command Center</title>
  <meta name="description" content="STUDYX keeps your subjects, assignments, timetable, GPA, focus sessions and spending in one place.">
  <meta name="theme-color" content="#2843d4">

  <!-- Apply the saved theme before first paint so dark mode doesn't flash -->
  <script>
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('studyx:v1') || '{}').theme;
        var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <div>
          <strong>STUDYX</strong>
          <small>Your academic space</small>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <button class="btn ghost block" id="theme-btn-side" data-action="theme" type="button"></button>
      </div>
    </aside>
    <div class="scrim" data-action="nav-close"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="nav-open" type="button" aria-label="Open menu"></button>
        <div class="titles">
          <p id="page-date"></p>
          <h1 id="page-title">Dashboard</h1>
        </div>
        <button class="icon-btn" id="theme-btn" data-action="theme" type="button" aria-label="Switch between light and dark mode"></button>
        <button class="avatar" id="avatar" data-action="edit-name" type="button" aria-label="Edit your name">S</button>
      </header>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <dialog id="modal" aria-labelledby="modal-title">
    <form id="modal-form">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button class="icon-btn sm" type="button" data-action="modal-close" aria-label="Close">&times;</button>
      </div>
      <div class="fields" id="modal-fields"></div>
      <p class="form-error" id="modal-error" role="alert"></p>
      <div class="modal-foot">
        <button class="btn ghost" type="button" data-action="modal-close">Cancel</button>
        <button class="btn primary" type="submit" id="modal-submit">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json" hidden>

  <script src="js/app.js"></script>
</body>
</html>
